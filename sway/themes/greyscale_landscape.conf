# Sway theme: greyscale_landscape
# Derived from ~/Pictures/Wallpapers/grey-cabin-landscape.jpg
# (near-black scene, one lit cabin wall). Saved 2026-10-04 from the live config.
# Monochrome ramp; urgent is the one exception, a desaturated lamplight amber,
# because a grey "urgent" is indistinguishable from a grey "idle".
#
# Palette:
#   Focused border    #C3C7CC
#   Focused background#111214
#   Focused text      #E6E8EA
#   Focused indicator #EDEFF1
#   Inactive border   #4A4D52
#   Unfocused border  #2E3033
#   Unfocused bg      #08090A
#   Unfocused text    #7C8085
#   Urgent            #C2724A
#   Lock screen        08090A

output * bg ~/Pictures/Wallpapers/grey-cabin-landscape.jpg fill

# class                    border  bg      text    indicator child_border
client.focused             #C3C7CC #111214 #E6E8EA #EDEFF1   #C3C7CC
client.focused_inactive    #4A4D52 #111214 #AFB3B8 #2E3033   #2E3033
client.unfocused           #2E3033 #08090A #7C8085 #2E3033   #2E3033
client.urgent              #C2724A #1A1B1D #E6E8EA #D98C5F   #C2724A
client.placeholder         #4A4D52 #111214 #7C8085 #2E3033   #2E3033
client.background          #08090A

# swayidle/swaylock lock screen color to match:
#   swaylock -f -c 08090A
