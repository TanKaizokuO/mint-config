# Sway theme: Catpuchin_Mocha_Theme
# Backed up on 2026-08-21 before switching to Red_Mountain.
# To restore: copy the two blocks below back into ~/.config/sway/config
# (the "output * bg" line and the "APPEARANCE" client.* block), then
# `swaymsg reload`.

output * bg #1e1e2e solid_color

# class                 border  bg      text    indicator child_border
client.focused          #89b4fa #89b4fa #1e1e2e #f5c2e7   #89b4fa
client.focused_inactive #45475a #45475a #cdd6f4 #45475a   #45475a
client.unfocused        #313244 #1e1e2e #6c7086 #313244   #313244
client.urgent           #f38ba8 #f38ba8 #1e1e2e #f38ba8   #f38ba8
client.placeholder      #1e1e2e #1e1e2e #cdd6f4 #1e1e2e   #1e1e2e
client.background       #1e1e2e

# swayidle/swaylock lock screen color used alongside this theme:
#   swaylock -f -c 1e1e2e
