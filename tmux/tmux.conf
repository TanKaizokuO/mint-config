# |  |_.--------.--.--.--.--.
# |   _|        |  |  |_   _|
# |____|__|__|__|_____|__.__|
#

# ================================================================
# GENERAL SETTINGS
# ================================================================

#  Terminal colors
set -s default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -ga terminal-overrides ",*256col*:Tc"

# Passthrough for yazi images
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# tmux decides UTF-8 support by string-matching "UTF-8" in LANG/LC_CTYPE
# rather than calling nl_langinfo(), so a bare locale like "en_IN" makes it
# render every glyph as "_". Keep the suffix on both.
set -ga update-environment LANG
set -ga update-environment LC_CTYPE

# Mouse support
set -g mouse on

# Scrollback buffer
set -g history-limit 150000

# Vim mode
set-window-option -g mode-keys vi

# Terminal titles
set -g set-titles on
set -g set-titles-string "#W"

# ================================================================
# PREFIX KEY
# ================================================================

set -g prefix C-b
bind-key C-b send-prefix

# ================================================================
# GLASS THEME COLORS. Palette and color styles live in the mode file
# (~/.config/glass-themes/current -> dark|light). Sourced here because tmux
# expands $VAR as it parses a file, so colors must come from a sourced file.
# ================================================================

source-file ~/.config/glass-themes/current/tmux.conf

# ================================================================
# STATUS BAR - MINIMAL
# ================================================================

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify centre

# Left - session name, turns red while the prefix is held
set -g status-left-length 60

# Right - zoom flag, pane count, clock
set -g status-right-length 60

# Popups (display-menu, sessionx, ...)
set -g popup-border-lines rounded

# Menus
set -g menu-border-lines rounded

# Clock (prefix + t)
set -g clock-mode-style 24

# ================================================================
# PANES - CLEAN BORDERS
# ================================================================

# Start numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Pane borders - minimal
set -g pane-border-lines single
set -g pane-border-indicators colour
set -g pane-border-status off

# prefix + q overlay
set -g display-panes-time 1500
set -g display-time 2000

# ================================================================
# COPY MODE - VIM-LIKE
# ================================================================

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
unbind -T copy-mode-vi MouseDragEnd1Pane 

# ================================================================
# KEY BINDINGS - INTUITIVE
# ================================================================

# Reload config
bind r source-file ~/.tmux.conf \; display " Config reloaded"
bind-key v run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh' \; display-message "Session saved!"

# Split panes (intuitive keys)
bind w split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Navigate panes (vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r C-h resize-pane -L 2
bind -r C-j resize-pane -D 2
bind -r C-k resize-pane -U 2
bind -r C-l resize-pane -R 2

# Maximize pane
bind m resize-pane -Z

# Reorder windows
bind -r C-Left swap-window -t -1\; select-window -t -1
bind -r C-Right swap-window -t +1\; select-window -t +1

# ================================================================
# PLUGINS - ESSENTIAL ONLY
# ================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'

# Plugin settings
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Plugin keybinds
set -g @sessionx-bind 'space'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
