# ~/.config/mako/config — light theme: same fill as Waybar, rgba(162,162,165,0.61)
# Reload after editing:  makoctl reload

## Appearance
font=JetBrainsMono NFM 12
background-color=#A2A2A59C
text-color=#1D1D1F
border-color=#FFFFFF6E
progress-color=over #0000001A

border-size=1
border-radius=14
padding=12
margin=10
width=360
height=120
icons=1
max-icon-size=48

## Position & behaviour
anchor=top-right
layer=overlay
default-timeout=10000
ignore-timeout=0
max-visible=5
sort=-time

## Format: bold summary, body underneath
format=<b>%s</b>\n%b

## Low urgency — dimmer hairline and muted text
[urgency=low]
border-color=#FFFFFF40
text-color=#3A3A3F
default-timeout=10000

## Normal urgency — standard hairline
[urgency=normal]
border-color=#FFFFFF6E

## Critical — amber, the one accent in the palette
[urgency=critical]
border-color=#C25E00
text-color=#C25E00
default-timeout=10000

## Group notifications from the same app
[grouped]
format=<b>%s</b>\n%b (%g)
