# Light theme: same fill as Waybar (#A2A2A5), borders halfway between grey glass and full light.
# Focused window gets the brightest edge; urgent is the darker amber that reads on light.
#
# class                    border  bg      text    indicator child_border
client.focused             #FFFFFFA1 #D1D1D6 #1D1D1F #FFFFFFA1 #FFFFFFA1
client.focused_inactive    #FFFFFF43 #A2A2A5 #3A3A3F #FFFFFF43 #FFFFFF43
client.unfocused           #FFFFFF30 #A2A2A5 #3A3A3F #FFFFFF30 #FFFFFF30
client.urgent              #C25E00 #A2A2A5 #1D1D1F #C25E00 #C25E00
client.placeholder         #FFFFFF30 #A2A2A5 #3A3A3F #FFFFFF30 #FFFFFF30
client.background          #A2A2A5
