# ================================================================
# GLASS THEME: LIGHT. Sourced from ~/.tmux.conf via glass-themes/current.
# Smoked glass: kitty bg is #40423F at ~59% over a near-black wallpaper,
# so text is LIGHT. Same variable names as dark/tmux.conf, mapped role by role.
# ================================================================

# BG = text drawn on accent pills (dark ink on light pill)
BG="#1D1D1F"
# BG_DARK = popup and menu panels (glass base)
BG_DARK="#40423F"
# BG_HL = unused; one step lighter than the glass
BG_HL="#4E504D"
FG="#F2F2F5"
FG_DARK="#C7C7CC"
# BLUE = primary accent, mapped to the neutral active pill (no colored accent)
BLUE="#CFD3DC"
CYAN="#70E0E0"
# TEAL = deep blue-teal, mapped to light blue (unused)
TEAL="#7CC4FF"
GREEN="#7EE787"
MAGENTA="#D7A8FF"
RED="#FF9A90"
ORANGE="#FFB340"
YELLOW="#FFE066"
# GRAY = borders and separators (3:1 minimum on glass)
GRAY="#8E8E93"
# COMMENT = secondary text such as inactive windows and the clock (4.5:1 needed)
COMMENT="#C7C7CC"


# Color styles (use the palette above, so they must follow it in this file)
set -g status-style "fg=$FG_DARK bg=default"
set -g status-left "#[fg=#{?client_prefix,$RED,$MAGENTA},bold] #S #[fg=$GRAY,nobold]│"
set -g status-right "#[fg=$YELLOW]#{?window_zoomed_flag, ZOOM ,}#[fg=$GRAY]│#[fg=$COMMENT] #{window_panes}p #[fg=$GRAY]│#[fg=$COMMENT] %H:%M "
set -g window-status-separator "#[fg=$GRAY] · "
set -g window-status-format "#[fg=$COMMENT]#I#[fg=$COMMENT] #W"
set -g window-status-current-format "#[fg=$BLUE,bold]#I#[fg=$FG,bold] #W"
set -g window-status-last-style "fg=$FG_DARK"
set -g window-status-activity-style "fg=$YELLOW,nobold"
set -g window-status-bell-style "fg=$RED,bold"
set -g message-style "fg=$BG bg=$BLUE bold"
set -g message-command-style "fg=$BG bg=$YELLOW bold"
set -g popup-style "bg=$BG_DARK"
set -g popup-border-style "fg=$GRAY"
set -g menu-style "fg=$FG bg=$BG_DARK"
set -g menu-selected-style "fg=$BG bg=$BLUE bold"
set -g menu-border-style "fg=$GRAY"
set -g clock-mode-colour "$BLUE"
set -g pane-border-style "fg=$GRAY"
set -g pane-active-border-style "fg=$BLUE"
set -g display-panes-colour "$GRAY"
set -g display-panes-active-colour "$BLUE"
set -g mode-style "fg=$BG bg=$BLUE bold"
set -g copy-mode-match-style "fg=$BG bg=$YELLOW"
set -g copy-mode-current-match-style "fg=$BG bg=$ORANGE bold"
set -g copy-mode-mark-style "fg=$BG bg=$MAGENTA"