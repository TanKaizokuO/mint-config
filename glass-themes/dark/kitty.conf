
# vim:ft=kitty

## name:     Wallpaper Dusk
## blurb:    Near-black green ground, deep blue to teal sky, orange horizon.
##           Matches the wallpaper palette. Previous themes: Red_Mountain
##           (Midnight Alpine) and Catppuccin Mocha (themes/Catpuchin_Mocha_Theme.conf).

# The basic colors
foreground              #D5D8D4
background              #13160F
selection_foreground    #D5D8D4
selection_background    #0C3A52

# Cursor colors
cursor                  #C47A35
cursor_text_color       #13160F

# URL underline color when hovering with mouse
url_color               #5BA8B5

# Kitty window border colors
active_border_color     #C47A35
inactive_border_color   #2B332E
bell_border_color       #C2523A

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #13160F
active_tab_background   #C47A35
inactive_tab_foreground #858F91
inactive_tab_background #1B211E
tab_bar_background      #13160F

# Colors for marks (marked text in the terminal)
mark1_foreground #13160F
mark1_background #C47A35
mark2_foreground #D5D8D4
mark2_background #1F7290
mark3_foreground #13160F
mark3_background #D5A06A

# The 16 terminal colors

# black
color0 #1B211E
color8 #3A423D

# red
color1 #DE6A4E
color9 #DE6A4E

# green
color2  #7FA07A
color10 #98BA92

# yellow
color3  #D5A06A
color11 #E8BC85

# blue
color4  #3E8DB0
color12 #5BA8CC

# magenta
color5  #A07A8F
color13 #BC96AB

# cyan
color6  #5BA8B5
color14 #7CC2CE

# white
color7  #D5D8D4
color15 #EDEFEA

# Glass: translucency lives here so each theme can set its own
background_opacity 0.6
