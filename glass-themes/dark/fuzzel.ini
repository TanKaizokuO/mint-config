# ~/.config/fuzzel/fuzzel.ini
# Theme: dark liquid glass — smoky translucent panel, hairline border.
# Blur comes from the compositor (SwayFX), not from fuzzel.

[main]
font=JetBrainsMono NFM:size=15
# Follow sway's per-output scale rather than physical DPI. Matters here because
# eDP-1 runs at scale 1.5 while the Samsung runs at 1. With dpi-aware=yes the
# picker renders at different sizes per monitor.
dpi-aware=no
prompt=clip>
width=70
lines=12
horizontal-pad=20
vertical-pad=12
inner-pad=8
# Clipboard entries are often code/paths; tabs at 8 make them ragged.
tabs=4

[colors]
# glass fill, 42% alpha over the wallpaper
background=16161A6B
# primary text
text=F2F2F5ff
# the matched substring as you type
match=FFFFFFff
# selected row: active fill
selection=FFFFFF2E
# the selected row is a light tint, so its text stays white
selection-text=FFFFFFff
selection-match=FFFFFFff
# hairline border
border=FFFFFF24

[border]
# hairline border with generous rounding
width=1
radius=16
