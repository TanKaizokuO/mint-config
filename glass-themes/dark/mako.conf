# ~/.config/mako/config — dark liquid glass
# Reload after editing:  makoctl reload

## Appearance
font=JetBrainsMono NFM 15
background-color=#16161A6B
text-color=#F2F2F5
border-color=#FFFFFF24
progress-color=over #FFFFFF2E

border-size=1
border-radius=14
padding=12
margin=10
width=360
height=120
icons=1
max-icon-size=48

## Position & behaviour
anchor=top-right
layer=overlay
default-timeout=10000
ignore-timeout=0
max-visible=5
sort=-time

## Format: bold summary, body underneath
format=<b>%s</b>\n%b

## Low urgency — dimmer hairline and muted text
[urgency=low]
border-color=#FFFFFF14
text-color=#9A9AA3
default-timeout=10000

## Normal urgency — standard hairline
[urgency=normal]
border-color=#FFFFFF24

## Critical — amber, the one accent in the palette
[urgency=critical]
border-color=#FF9F0A
text-color=#FF9F0A
default-timeout=10000

## Group notifications from the same app
[grouped]
format=<b>%s</b>\n%b (%g)
