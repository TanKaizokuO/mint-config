;
; Polybar configuration
; For details, see: https://github.com/polybar/polybar
;==========================================================

;----------------------------------------------------------
; COLOR SCHEME
; Define all colors used throughout the bar
; Change these to customize your theme
;----------------------------------------------------------
[colors]
; Main colors
background = #1e1e2e
background-alt = #45475a
foreground = #cdd6f4

; Accent colors
primary = #89b4fa
secondary = #94e2d5
alert = #f38ba8
disabled = #585b70
orange = #f9e2af
green = #a6e3a1

;----------------------------------------------------------
; MAIN BAR SETTINGS
; Configure the appearance and layout of your main bar
;----------------------------------------------------------
[bar/bar]
; Bar dimensions
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
radius = 8



; Bar colors
background = ${colors.background}
foreground = ${colors.foreground}

; Visual styling
line-size = 3pt
border-size = 2pt
border-color = #00000000

; Spacing configuration
padding-left = 0
padding-right = 0
module-margin = 1

; Separator between modules
separator = |
separator-foreground = ${colors.disabled}

; Font configuration
font-0 = "Hurmit Nerd Font:style=Bold:size=12;2"
font-1 = "Hurmit Nerd Font:style=Regular:size=14;3"
font-2 = "Symbols Nerd Font:size=14;3"   

; Module placement
modules-left = xworkspaces
modules-center = date
modules-right = network network-wired battery pulseaudio memory cpu

; Cursor behavior
cursor-click = pointer
cursor-scroll = ns-resize

; Enable IPC for external script control
enable-ipc = true

; i3 restack fixes workspace switching visual glitches
wm-restack = i3

;----------------------------------------------------------
; SYSTEM TRAY
; Shows app icons like Discord, Spotify, etc.
;----------------------------------------------------------
; [module/systray]
; type = internal/tray
; format-margin = 8pt
; tray-spacing = 16pt

;----------------------------------------------------------
; WORKSPACES (i3)
; Shows your virtual desktops/workspaces
;----------------------------------------------------------
[module/xworkspaces]
type = internal/xworkspaces

; Active workspace styling (currently focused)
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 1

; Occupied workspace (has windows but not focused)
label-occupied = %name%
label-occupied-padding = 1

; Urgent workspace (window demands attention)
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

; Empty workspace (no windows)
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

;----------------------------------------------------------
; AUDIO (PULSE)
; Shows volume level and allows click to mute
; Click to toggle mute, right-click opens mixer
; Scroll up/down to adjust volume
;----------------------------------------------------------
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>

; Volume label (shows percentage)
label-volume = %percentage%%
label-volume-foreground = ${colors.primary}

; Muted state
label-muted = 󰝟
label-muted-foreground = ${colors.disabled}
label-muted-font = 2

; Volume level icons (changes based on volume percentage)
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 2
ramp-volume-foreground = ${colors.primary}

; Click and scroll actions
click-right = pavucontrol
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +2%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -2%

;----------------------------------------------------------
; MEMORY USAGE
; Shows RAM usage with visual indicator
; Color gradient: blue (low) → teal (medium) → red (critical)
;----------------------------------------------------------
[module/memory]
type = internal/memory
interval = 2
format = <ramp-used> <label>
label = %percentage_used%%

ramp-used-0 = 󰻠
ramp-used-1 = 󰻠
ramp-used-2 = 󰻠
ramp-used-3 = 󰻠
ramp-used-4 = 󰻠
ramp-used-5 = 󰻠
ramp-used-6 = 󰻠
ramp-used-7 = 󰻠
ramp-used-font = 2

; Color gradient based on usage
ramp-used-0-foreground = ${colors.primary}
ramp-used-1-foreground = ${colors.primary}
ramp-used-2-foreground = ${colors.primary}
ramp-used-3-foreground = ${colors.secondary}
ramp-used-4-foreground = ${colors.secondary}
ramp-used-5-foreground = ${colors.alert}
ramp-used-6-foreground = ${colors.alert}
ramp-used-7-foreground = ${colors.alert}

;----------------------------------------------------------
; CPU LOAD
; Shows CPU usage with visual indicator
; Color gradient: blue (low) → teal (medium) → red (critical)
;----------------------------------------------------------
[module/cpu]
type = internal/cpu
interval = 2
format = <ramp-load> <label>
label = %percentage%%

ramp-load-0 = 󰍛
ramp-load-1 = 󰍛
ramp-load-2 = 󰍛
ramp-load-3 = 󰍛
ramp-load-4 = 󰍛
ramp-load-5 = 󰍛
ramp-load-6 = 󰍛
ramp-load-7 = 󰍛
ramp-load-font = 2

; Color gradient based on load
ramp-load-0-foreground = ${colors.primary}
ramp-load-1-foreground = ${colors.primary}
ramp-load-2-foreground = ${colors.primary}
ramp-load-3-foreground = ${colors.secondary}
ramp-load-4-foreground = ${colors.secondary}
ramp-load-5-foreground = ${colors.alert}
ramp-load-6-foreground = ${colors.alert}
ramp-load-7-foreground = ${colors.alert}

;----------------------------------------------------------
; NETWORK (WIFI)
; Shows WiFi connection status with signal strength
; Displays SSID name and signal icon
;----------------------------------------------------------
[module/network]
type = internal/network
interface-type = wireless
interval = 3

; WiFi connected - show signal strength
format-connected = <ramp-signal> <label-connected>
label-connected = %essid%
label-connected-foreground = ${colors.foreground}

; WiFi disconnected
format-disconnected = <label-disconnected>
label-disconnected = 󰤮
label-disconnected-foreground = ${colors.disabled}
label-disconnected-font = 2

; WiFi signal strength icons
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-font = 2
ramp-signal-foreground = ${colors.primary}

;----------------------------------------------------------
; NETWORK (ETHERNET)
; Shows wired/ethernet connection status
; Only displays when ethernet cable is connected
;----------------------------------------------------------
[module/network-wired]
type = internal/network
interface-type = wired
interval = 3

; Ethernet connected
format-connected = <label-connected>
format-connected-prefix = "󰈀 "
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${colors.primary}
label-connected = Connected
label-connected-foreground = ${colors.foreground}

; Ethernet disconnected (hide module)
format-disconnected = ""

;----------------------------------------------------------
; DATE & TIME
; Centered on the bar
; Click to toggle between time and full date/time
;----------------------------------------------------------
[module/date]
type = internal/date
interval = 1

; Time formats
date = %d-%m-%Y %H:%M
date-alt = %Y-%m-%d %H:%M:%S

; Clock icon prefix
format-prefix = "󰥔 "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = %date%
label-foreground = ${colors.foreground}

;----------------------------------------------------------
; BATTERY
; Shows battery status with visual indicators
; Icons change based on charge level and charging state
; Color coding: red (critical) → orange (low) → blue (good)
;
; NOTE: full-at = 80 is intentional for battery health limiting.
; If your system does not cap charging at 80%, change this to 99.
;----------------------------------------------------------
[module/battery]
type = internal/battery

full-at = 80
battery = BAT1
adapter = ACAD

; Display formats
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

; Labels for each state
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

; Charging label uses green to make it obvious at a glance
label-charging-foreground = ${colors.green}
label-discharging-foreground = ${colors.foreground}
label-full-foreground = ${colors.primary}

; Discharging icons — 7 levels for finer granularity
ramp-capacity-0 = 󰂎   
ramp-capacity-1 = 󰁺   
ramp-capacity-2 = 󰁻   
ramp-capacity-3 = 󰁼   
ramp-capacity-4 = 󰁽   
ramp-capacity-5 = 󰁾   
ramp-capacity-6 = 󰁹   
ramp-capacity-font = 2
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1-foreground = ${colors.alert}
ramp-capacity-2-foreground = ${colors.orange}
ramp-capacity-3-foreground = ${colors.orange}
ramp-capacity-4-foreground = ${colors.primary}
ramp-capacity-5-foreground = ${colors.primary}
ramp-capacity-6-foreground = ${colors.primary}

; Charging animation frames
animation-charging-0 = 󰂎
animation-charging-1 = 󰁺
animation-charging-2 = 󰁻
animation-charging-3 = 󰁼
animation-charging-4 = 󰁽
animation-charging-5 = 󰁾
animation-charging-6 = 󰁹
animation-charging-font = 2
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750

;----------------------------------------------------------
; GENERAL SETTINGS
; Global polybar behavior settings
;----------------------------------------------------------
[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini