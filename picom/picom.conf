#################################
#           Shadows             #
#################################
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.5;
shadow-offset-x = -4;
shadow-offset-y = -4;

shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'tooltip'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "class_g = 'slop'",
  "class_g = 'Conky'",
  "class_g = 'kitty'",    # <-- ADD: no shadow on kitty
  "fullscreen"
];


#################################
#   Transparency / Opacity      #
#################################
inactive-opacity = 0.92;
inactive-opacity-override = false;

focus-exclude = [
  "class_g = 'slop'"
];

opacity-rule = [
  "100:class_g = 'mpv'",
  "100:class_g = 'Gimp'",
  "100:fullscreen"
];


#################################
#           Corners             #
#################################
corner-radius = 8;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "class_g = 'kitty'",
  "fullscreen",
  "border_width = 0"    # <-- ADD: excludes tiled/borderless windows
];


#################################
#       General Settings        #
#################################
backend = "glx";
vsync = true;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

use-damage = true;

log-level = "warn";

wintypes:
{
  tooltip   = { fade = false; shadow = false; opacity = 0.9; focus = true; };
  dock      = { shadow = false; clip-shadow-above = true; };
  dnd       = { shadow = false; };
  popup_menu    = { shadow = true; opacity = 0.95; };
  dropdown_menu = { shadow = true; opacity = 0.95; };
};