"$schema" = 'https://starship.rs/config-schema.json'

# ============================================================================
# Red Mountain / Midnight Alpine — Jetpack-style prompt
#
# Structure is based on Starship's built-in "jetpack" preset (`starship
# preset jetpack`): a minimal left-hand prompt (status/duration/character)
# with a right-aligned, context-sensitive info line (directory, git,
# runtimes). Colors are swapped for the Red Mountain / Midnight Alpine
# desktop palette (see ~/.config/sway/themes/Red_Mountain.conf) so the
# terminal prompt matches Sway/Waybar/Mako/Kitty.
#
# Backup of the previous (pastel-powerline-style) config:
#   ~/.config/starship_themes/starship.toml.pre-jetpack-backup-<timestamp>
# ============================================================================

add_newline = true
continuation_prompt = "[▸▹ ](italic muted)"

# --- Left prompt: status/meta only, character last ---
format = """
$cmd_duration\
$sudo\
$username\
$character"""

# --- Right prompt: context, only shown when relevant ---
right_format = """
$directory\
$git_branch\
$git_status\
$docker_context\
$python\
$nodejs"""

palette = 'red_mountain'

[palettes.red_mountain]
# Red Mountain / Midnight Alpine core palette
bg             = "#070B14"  # background
surface        = "#0D1624"  # surface / panel bg
fg             = "#D6DCE6"  # primary text
muted          = "#788598"  # secondary/muted text
slate          = "#526A82"  # slate blue — git branch / secondary metadata
border         = "#263344"  # border/secondary
crimson        = "#9E3046"  # primary accent
bright_crimson = "#C44752"  # important/highlighted states
magenta        = "#8D3B5A"  # secondary accent
amber          = "#B58A52"  # warnings
green          = "#718A78"  # success
error          = "#B83B4B"  # errors

[palettes.glass_smoke]
# Glass light mode ("smoked" kitty, bg #40423F at ~59% over near-black).
# Text-only styles, so every role is a foreground checked for WCAG >= 4.5
# against #40423F. Neutral greys for chrome; color only for status.
bg             = "#40423F"  # background (kitty smoked glass)
surface        = "#4A4C49"  # surface / panel bg
fg             = "#F2F2F5"  # primary text (9.08:1)
muted          = "#C7C7CC"  # secondary/muted text (6.03:1)
slate          = "#B5B5BA"  # git branch / secondary metadata, neutral grey (4.97:1)
border         = "#8E8E93"  # border/secondary (non-text)
crimson        = "#E5E5EA"  # repo root accent, neutral (8.08:1)
bright_crimson = "#FFE066"  # git status summary / staged (7.78:1)
magenta        = "#D7A8FF"  # secondary accent: sudo, diverged, vi replace (5.28:1)
amber          = "#FFB340"  # warnings: modified, untracked, python (5.69:1)
green          = "#7EE787"  # success (6.61:1)
error          = "#FF9A90"  # errors (4.97:1)

# --- Prompt character: reflects last command's exit status ---
[character]
format = "$symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold error)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold magenta)"
vimcmd_replace_symbol = "[❮](bold magenta)"
vimcmd_visual_symbol = "[❮](bold amber)"

# --- Sudo: only shown while actively elevated ---
[sudo]
format = "[$symbol]($style) "
style = "bold italic magenta"
symbol = "⋈┈"
disabled = false

# --- Username: only shown for root or non-default user ---
[username]
style_user = "bold italic muted"
style_root = "bold italic bright_crimson"
format = "[⭘ $user]($style) "
show_always = false
disabled = false

# --- Command duration: muted, only shown above a threshold ---
[cmd_duration]
min_time = 2000
format = "[◄ $duration ](italic muted) "
show_notifications = true
min_time_to_notify = 45000

# --- Directory: primary text, crimson accent at repo root ---
[directory]
home_symbol = "⌂"
truncation_length = 3
truncation_symbol = "…/"
read_only = " ◈"
style = "italic bold fg"
read_only_style = "muted"
format = "[$path]($style)[$read_only]($read_only_style) "
repo_root_style = "bold crimson"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

# --- Git branch: slate blue (secondary metadata) ---
[git_branch]
symbol = "[△](bold slate)"
format = "[$symbol $branch(:$remote_branch)]($style) "
style = "italic slate"
truncation_symbol = "⋯"
truncation_length = 20

# --- Git status: bright crimson for the summary, semantic colors per state ---
[git_status]
style = "bold italic bright_crimson"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style)) "
ahead = "[▴${count}](green)"
behind = "[▿${count}](error)"
diverged = "[◇▴${ahead_count}▿${behind_count}](magenta)"
untracked = "[◌◦](amber)"
stashed = "[◃◈](muted)"
modified = "[●◦](amber)"
staged = "[▪${count}](bright_crimson)"
renamed = "[◎◦](slate)"
deleted = "[✕](error)"
conflicted = "[◪◦](error)"

# --- Docker: only shown when a non-default context is active ---
[docker_context]
symbol = "◧ "
style = "slate"
format = "[$symbol$context]($style) "
only_with_files = true

# --- Runtimes: only rendered inside a matching project ---
[python]
symbol = "⌉⌊ "
style = "bold amber"
format = "[${symbol}${version}( \\(#$virtualenv\\))]($style) "

[nodejs]
symbol = "◫ "
style = "bold green"
format = "[$symbol($version )]($style) "
detect_files = ["package.json", "package-lock.json", "yarn.lock", ".node-version"]

# --- Everything else the jetpack preset carries: explicitly disabled ---
# (kept out of $format/$right_format above, disabled here too so a stray
# reference or preset diff doesn't silently re-enable them)
[hostname]
disabled = true
[localip]
disabled = true
[shlvl]
disabled = true
[shell]
disabled = true
[jobs]
disabled = true
[nix_shell]
disabled = true
[container]
disabled = true
[git_metrics]
disabled = true
[time]
disabled = true
[line_break]
disabled = true
[c]
disabled = true
[rust]
disabled = true
[golang]
disabled = true
[php]
disabled = true
[java]
disabled = true
[kotlin]
disabled = true
[haskell]
disabled = true
[conda]
disabled = true
[package]
disabled = true
[memory_usage]
disabled = true
[battery]
disabled = true
[status]
disabled = true
[os]
disabled = true
